name: review_ai
description: "AI Food Review App"
publish_to: "none"
version: 1.15.0+123
environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  clarity_flutter: ^1.0.0
  logger: ^2.4.0

  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.6.1
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.2.0
  google_mobile_ads: ^6.0.0
  confetti: ^0.7.0
  device_info_plus: ^9.1.0 
  package_info_plus: ^4.2.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  connectivity_plus: ^6.0.0

  geocoding: ^2.2.1
  geolocator: ^14.0.1
  permission_handler: ^11.0.0
  url_launcher: ^6.2.5
  android_intent_plus: ^6.0.0
  dio: ^5.7.0
  json_annotation: ^4.9.0
  in_app_review: ^2.0.11
  image: ^4.1.0
  equatable: ^2.0.5
  flutter_local_notifications: ^19.0.0 
  timezone: ^0.10.0                    
  firebase_core: ^4.4.0
  firebase_app_check: ^0.4.7
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.1
  firebase_performance: ^0.11.1+4
  flutter_cache_manager: ^3.4.1
  in_app_update: ^4.2.5
  firebase_remote_config: ^6.2.0
  flutter_jailbreak_detection: ^1.10.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"
  mockito: ^5.4.4
  json_serializable: ^6.9.5
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.3.15
  firebase_app_check_platform_interface: ^0.4.2+1
  firebase_core_platform_interface: ^8.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - icon/
  fonts:
    - family: SCDream
      fonts:
        - asset: assets/fonts/SCDream3.otf
          weight: 300
        - asset: assets/fonts/SCDream4.otf
          weight: 400
        - asset: assets/fonts/SCDream5.otf
          weight: 500
    - family: Do Hyeon
      fonts:
        - asset: assets/fonts/BMDOHYEON.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/app_icon.png"
