name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target (the selected branch must match)'
        required: true
        default: qa-only
        type: choice
        options:
          - qa-only
          - firebase-develop
          - play-main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: qa-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.1'
          cache: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci
      - name: Check repository hygiene
        run: python3 .github/scripts/check_repository_hygiene.py
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze code
        run: flutter analyze --no-fatal-infos > flutter_analyze.log
      - name: Setup ReviewDog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1
        with:
          reviewdog_version: v0.21.0
      - name: Run ReviewDog
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -efm="    %tinfo • %m • %f:%l:%c • %n" -efm="    %twarning • %m • %f:%l:%c • %n" -efm="    %terror • %m • %f:%l:%c • %n" -name="flutter analyze" -reporter=github-pr-review -filter-mode=added -fail-on-error=false < flutter_analyze.log
      - name: Run Flutter tests with coverage
        run: flutter test --coverage
      - name: Run Worker security tests
        working-directory: cloudflare-worker
        run: npm test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  deploy:
    name: Android Deploy
    needs: qa
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' &&
        ((inputs.deploy_target == 'firebase-develop' && github.ref == 'refs/heads/develop') ||
         (inputs.deploy_target == 'play-main' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: android-deploy-${{ github.ref }}
      cancel-in-progress: false
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.1'
          cache: true
      - name: Setup Node
        if: github.ref == 'refs/heads/develop'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: .github/ci-tools/package-lock.json
      - name: Install Firebase CLI
        if: github.ref == 'refs/heads/develop'
        working-directory: .github/ci-tools
        run: npm ci
      - name: Decode Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties
      - name: Decode Play service account
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: printf '%s' "$ANDROID_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > android/service_account.json
      - name: Build Android app
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 200 ))
          echo "Building with build-number: $BUILD_NUMBER"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            flutter build appbundle --release --build-number="$BUILD_NUMBER"
          else
            flutter build apk --release --build-number="$BUILD_NUMBER"
          fi
      - name: Setup Ruby
        if: github.ref == 'refs/heads/main'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 2
          working-directory: android
      - name: Deploy to Firebase App Distribution
        if: github.ref == 'refs/heads/develop'
        working-directory: .github/ci-tools
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase appdistribution:distribute ../../build/app/outputs/flutter-apk/app-release.apk --app "$FIREBASE_ANDROID_APP_ID" --groups testers
      - name: Generate release notes
        if: github.ref == 'refs/heads/main'
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 200 ))
          python3 .github/scripts/generate_release_notes.py "$BUILD_NUMBER"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Deploy to Play Store
        if: github.ref == 'refs/heads/main'
        working-directory: android
        run: bundle exec fastlane deploy
      - name: Remove materialized credentials
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties android/service_account.json "${{ runner.temp }}/firebase-service-account.json"
