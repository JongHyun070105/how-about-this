name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze --no-fatal-infos > flutter_analyze.log

      - name: Setup ReviewDog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run ReviewDog
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat flutter_analyze.log | reviewdog -efm="    %tinfo • %m • %f:%l:%c • %n" -efm="    %twarning • %m • %f:%l:%c • %n" -efm="    %terror • %m • %f:%l:%c • %n" -name="flutter analyze" -reporter=github-pr-review -filter-mode=added -fail-on-error=false

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7

  deploy:
    name: Android Deploy
    needs: qa
    # main 또는 develop 브랜치에 푸시되거나 수동으로 실행될 때만 배포 진행
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.1'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Decode Service Account JSON
        run: |
          echo "${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > android/service_account.json

      - name: Build Android App
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} + 200 ))
          echo "Building with build-number: $BUILD_NUMBER"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            flutter build appbundle --release --build-number=$BUILD_NUMBER
          else
            flutter build apk --release --build-number=$BUILD_NUMBER
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 1
          working-directory: android

      - name: Find Build Files
        run: ls -R build/app/outputs/

      - name: Deploy to Firebase App Distribution (Develop)
        if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
        run: |
          echo "$GCP_SA_KEY" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
          npx firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app "${{ secrets.FIREBASE_ANDROID_APP_ID }}" --groups testers
          rm service-account.json
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy to Play Store (Main)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: maierj/fastlane-action@v3.0.0
        with:
          lane: deploy
          subdirectory: android
