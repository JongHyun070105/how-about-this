name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (deploy or delete-staging)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - delete-staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy / Manage Worker
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Delete Staging Worker (Optional Action)
        if: github.event.inputs.action == 'delete-staging'
        working-directory: cloudflare-worker
        run: |
          echo "Deleting reviewai-api-proxy-staging worker..."
          npx wrangler delete reviewai-api-proxy-staging --force || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Production Worker
        if: github.event.inputs.action != 'delete-staging'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-worker'
          environment: 'production'
          preCommands: npx wrangler whoami
          command: deploy
