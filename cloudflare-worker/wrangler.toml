name = "reviewai-api-proxy"
main = "src/index.js"
compatibility_date = "2026-04-21"

workers_dev = true

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[env.production]
name = "reviewai-api-proxy"
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "00cc2b1530ca499fbaef968ef9c7ca95"
[[env.production.kv_namespaces]]
binding = "API_CACHE"
id = "7238157c15ff41a3bbdbbd25b8363784"
[[env.production.durable_objects.bindings]]
name = "GEMINI_PROXY_V2"
class_name = "GeminiProxyV2"
[env.production.vars]
MIN_APP_VERSION = "1.0.0"

[[env.production.migrations]]
tag = "v6"
new_sqlite_classes = ["GeminiProxyV2"]

